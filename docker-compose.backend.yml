# Dokploy "backend" application: Hono API + PostgreSQL.
# Deploy this compose file as one Dokploy project; deploy docker-compose.frontend.yml as a separate one.
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - hots_stats_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      replay-parser:
        condition: service_started
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      PORT: 3001
      WEB_ORIGIN: ${WEB_ORIGIN}
      API_PUBLIC_URL: ${API_PUBLIC_URL}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      SESSION_SECRET: ${SESSION_SECRET}
      CLAUDE_INTERNAL_SECRET: ${CLAUDE_INTERNAL_SECRET}
      BATTLENET_CLIENT_ID: ${BATTLENET_CLIENT_ID}
      BATTLENET_CLIENT_SECRET: ${BATTLENET_CLIENT_SECRET}
      # Internal-only (see apps/replay-parser/README.md): reached by service
      # name over the compose network, never published or given a domain.
      REPLAY_PARSER_URL: http://replay-parser:8090

  # Parses raw `.StormReplay` uploads from the web dropzone (POST /uploads on
  # `api`, above) -- internal-only, no published port, no Dokploy domain.
  # See apps/replay-parser/README.md.
  replay-parser:
    build:
      context: .
      dockerfile: apps/replay-parser/Dockerfile
    restart: unless-stopped

  # DB admin UI (browse/edit rows). Talks to `postgres` over the internal
  # compose network -- Postgres itself is never published. Reachable only
  # as http://<pi-lan-ip>:8080: deliberately given NO Dokploy domain and NO
  # entry in the Cloudflare tunnel config, so it never leaves the LAN.
  adminer:
    image: adminer:4-standalone
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres

volumes:
  hots_stats_pgdata:
