name: Build Daemon

# Compiles daemon-python into a standalone Windows .exe (no Python required
# on the player's machine) and publishes it as a workflow artifact, plus a
# GitHub Release asset on version tags.
#
# Every push to main that touches daemon-python's actual code (not just
# tests/docs) is treated as a release: `bump_version` bumps the patch
# version in pyproject.toml + constants.py, commits it, and creates the
# `vX.Y.Z` tag the release step below needs -- there's no other source of
# truth for "what's the next version" (no conventional-commit parsing, no
# manual tagging), which is the simplification that keeps this workflow the
# only place versioning happens. `build-windows` then always builds off
# that tag (falling back to the pushed tag itself, or a dev version, for
# the manual-tag / workflow_dispatch paths) and publishes a GitHub Release
# unconditionally for any tagged build.
#
# This single workflow owns both steps (rather than having `bump_version`'s
# tag push trigger a separate build workflow) because pushes made with the
# default GITHUB_TOKEN don't trigger new `on: push`/`on: tag` workflow runs
# -- see https://docs.github.com/actions/security-guides/automatic-token-authentication#using-the-github_token-in-a-workflow.

on:
  push:
    branches: [main]
    paths:
      - "daemon-python/**"
      - "!daemon-python/README.md"
      - "!daemon-python/tests/**"
      - ".github/workflows/build-daemon.yml"
    tags:
      - "v*"
  # Packaging is the one part of the release path that can't fail as a test
  # failure -- a mistake here produces a broken artifact instead. `pack-check`
  # below runs a publish-free `vpk pack` on PRs that touch the daemon so
  # packaging regressions surface at review time rather than at release time.
  pull_request:
    paths:
      - "daemon-python/**"
      - "!daemon-python/README.md"
      - ".github/workflows/build-daemon.yml"
  workflow_dispatch: {}

permissions:
  contents: write

env:
  PYTHON_VERSION: "3.11"
  # Deliberately not versioned (no "-vX.Y.Z" suffix): the release's git tag
  # and its title ("Daemon vX.Y.Z" below) are the only source of truth for
  # which version a release is. Used as Nuitka's --output-filename and, more
  # importantly, as `vpk pack`'s --mainExe: Velopack records that name in the
  # package manifest and looks for exactly it inside every future release, so
  # it must stay identical across versions or an update would install a
  # package whose declared main executable doesn't exist. It also has to
  # match `_EXE_NAME` in daemon-python/src/updater.py, which derives the
  # stable stub path Windows autostart points at.
  ASSET_NAME: hots-analytics-daemon.exe

jobs:
  bump_version:
    name: Bump version and tag
    # Only for a plain push to main -- a manual "vX.Y.Z" tag push or a
    # workflow_dispatch run already carries (or doesn't need) a version, so
    # don't bump again. The message check is belt-and-suspenders: it's the
    # commit this job itself creates, and per the GITHUB_TOKEN note above
    # that push can't actually retrigger this workflow anyway.
    if: "github.event_name == 'push' && github.ref == 'refs/heads/main' && !startsWith(github.event.head_commit.message, 'chore(daemon): release v')"
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.bump.outputs.version }}
      tag: ${{ steps.bump.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bump patch version in pyproject.toml + constants.py
        id: bump
        working-directory: daemon-python
        run: |
          set -euo pipefail
          current=$(grep -m1 '^version = ' pyproject.toml | sed -E 's/version = "(.*)"/\1/')
          IFS='.' read -r major minor patch <<< "$current"
          new="$major.$minor.$((patch + 1))"

          sed -i "s/^version = \"$current\"/version = \"$new\"/" pyproject.toml
          sed -i "s/^APP_VERSION = \"$current\"/APP_VERSION = \"$new\"/" src/constants.py

          echo "version=$new" >> "$GITHUB_OUTPUT"
          echo "tag=v$new" >> "$GITHUB_OUTPUT"

      - name: Commit and tag
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add daemon-python/pyproject.toml daemon-python/src/constants.py
          git commit -m "chore(daemon): release ${{ steps.bump.outputs.tag }}"
          git tag "${{ steps.bump.outputs.tag }}"
          git push origin HEAD:main
          git push origin "${{ steps.bump.outputs.tag }}"

  build-windows:
    name: Build Windows executable
    needs: [bump_version]
    # Runs whether bump_version made a new release (push to main) or was
    # skipped (manual "vX.Y.Z" tag push, or workflow_dispatch). Never on a
    # pull request -- that's `pack-check`'s job, which does the same build
    # but stops before anything that publishes.
    if: always() && github.event_name != 'pull_request' && (needs.bump_version.result == 'success' || needs.bump_version.result == 'skipped')
    # Cross-compiling a native Windows .exe from Linux isn't reliable for
    # this use case, so the build must run on a real Windows runner.
    runs-on: windows-latest
    defaults:
      run:
        working-directory: daemon-python

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.bump_version.outputs.tag || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: daemon-python/pyproject.toml

      - name: Install daemon + build dependencies
        run: pip install -e ".[build]"

      - name: Resolve binary version
        id: version
        shell: bash
        run: |
          if [[ -n "${{ needs.bump_version.outputs.version }}" ]]; then
            echo "version=${{ needs.bump_version.outputs.version }}" >> "$GITHUB_OUTPUT"
          elif [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.0.0-dev.${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      # Nuitka bundles its own ccache, but its cache dir lives on the
      # runner's disk and every windows-latest VM starts empty -- without
      # persisting it, all ~880 generated C files (stdlib, heroprotocol,
      # opencv, onnxruntime, Tcl/Tk...) are a cache miss on every run,
      # which alone is ~75% of this job's total time (measured: 23 of its
      # ~32 minutes). This also stops the MinGW64 toolchain and depends.exe
      # from being re-downloaded every run. github.sha in the primary key
      # forces a fresh save each run (cache entries are immutable) while
      # restore-keys still seeds from the closest previous cache.
      - name: Cache Nuitka compilation cache
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\Nuitka\Nuitka\Cache
          key: nuitka-${{ runner.os }}-${{ hashFiles('daemon-python/pyproject.toml') }}-${{ github.sha }}
          restore-keys: |
            nuitka-${{ runner.os }}-${{ hashFiles('daemon-python/pyproject.toml') }}-
            nuitka-${{ runner.os }}-

      # The binary version (this tag / dev build) and PARSER_VERSION (in
      # src/constants.py) are intentionally independent: the daemon can ship
      # a patch (network fix, watcher fix) without bumping the ingestion
      # payload format, which would otherwise force a re-upsert of every
      # already-ingested replay. Do not derive one from the other.
      - name: Build with Nuitka
        shell: bash
        run: >
          python -m nuitka
          --onefile
          --standalone
          --mingw64
          --assume-yes-for-downloads
          --enable-plugin=tk-inter
          --windows-console-mode=attach
          --windows-icon-from-ico=assets/app-icon.ico
          --include-package=heroprotocol
          --include-package=watchdog
          --include-package=pystray
          --include-package=PIL
          --include-package=src
          --include-package-data=rapidocr_onnxruntime
          --include-data-files=src/models/en_PP-OCRv5_rec_mobile.onnx=src/models/en_PP-OCRv5_rec_mobile.onnx
          --output-dir=dist
          --output-filename=${{ env.ASSET_NAME }}
          run.py
        # Nuitka over PyInstaller: it compiles to native C rather than
        # embedding a zipped interpreter, which triggers far fewer AV false
        # positives on Windows.
        #
        # --onefile (not plain --standalone + zip): the daemon is a
        # long-running background watcher a player launches a handful of
        # times, not a script invoked thousands of times per session, so
        # onefile's one-time self-extraction cost at startup is irrelevant,
        # and a single double-clickable .exe is much friendlier to ship than
        # a folder of files. If onefile ever proves more AV-flagged in
        # practice than a plain --standalone build, switch to publishing the
        # --standalone folder as a zip instead — the rest of this workflow
        # (versioning, artifact upload, release publishing) stays the same.
        #
        # --mingw64: forces Nuitka's bundled MinGW64 toolchain instead of
        # relying on whatever MSVC install happens to be on windows-latest,
        # so the build doesn't silently change behavior on runner image
        # updates. --assume-yes-for-downloads lets Nuitka fetch it
        # non-interactively in CI.
        #
        # --windows-icon-from-ico=assets/app-icon.ico: the web app's favicon
        # (apps/web/public/favicon.svg, rasterized -- see daemon-python/assets/
        # for how it was generated), so the .exe shows the same mark in
        # Explorer/the taskbar instead of Nuitka's default icon. The
        # pystray tray icon uses a separate copy of the same mark, embedded
        # in src/_icon_data.py so it survives --onefile packaging.
        #
        # --enable-plugin=tk-inter: bundles Tcl/Tk so the settings window
        # (src/gui.py) runs standalone. --windows-console-mode=attach: this
        # app is both a double-clicked tray app (no console, so `attach`
        # stays silent) and a CLI tool (`--resync`, `--help` from a terminal
        # or this CI smoke test, where `attach` reuses the parent's console
        # so stdout is visible) — `disable` would break the latter.
        #
        # run.py (not src/main.py): compiling src/main.py directly makes
        # Nuitka treat it as the top-level `__main__` module with no parent
        # package, which breaks its `from . import ...` relative imports
        # (see run.py's docstring for the full explanation). run.py is a
        # trivial top-level launcher that imports `src.main` as a real
        # package instead, which fixes that without touching src/'s internal
        # imports.
        #
        # --include-package on heroprotocol/watchdog/pystray/PIL/src: these
        # pick their actual implementation dynamically at runtime
        # (heroprotocol loads a protocol module per replay build number;
        # watchdog and pystray each pick an OS-specific backend; PIL is
        # pystray's icon-image dependency), which Nuitka's static import
        # analysis can miss — this forces the full package tree into the
        # build regardless. --include-package=src is belt-and-suspenders
        # alongside run.py's static `from src.main import main`.
        #
        # --include-package-data=rapidocr_onnxruntime: RapidOCR (src/ocr.py)
        # locates its config.yaml and its three bundled ONNX models
        # (models/*.onnx) at runtime as plain files next to its own package
        # directory (`Path(__file__).resolve().parent`), not as Python
        # imports. Nuitka's default import-following only bundles the
        # package's .py files, not that non-code data, so without this flag
        # the .exe builds and runs fine until the first live-draft capture,
        # which fails with `FileNotFoundError: ...\rapidocr_onnxruntime\
        # config.yaml` from inside the onefile temp extraction dir --
        # caught by ocr.py's `except Exception` and logged, so it degrades
        # to "unreadable" names instead of crashing, which is also why this
        # was easy to miss until someone actually read the daemon's logs.
        #
        # --include-data-files=src/models/en_PP-OCRv5_rec_mobile.onnx=...:
        # this one *is* a Python-imported package's data (src/ocr.py's own
        # Latin-script OCR model, see that file's module docstring), but
        # --include-package=src above only follows src/'s .py files, not
        # arbitrary non-code data sitting next to them -- same gap
        # --include-package-data=rapidocr_onnxruntime fixes for RapidOCR's
        # own bundled models, just for a file that isn't inside an
        # installed pip package. The dest path (right of `=`) mirrors
        # ocr.py's own `Path(__file__).resolve().parent / "models" / ...`
        # lookup, so it has to stay in sync with that path if either one
        # ever moves.

      - name: Smoke test the executable
        shell: bash
        run: ./dist/${{ env.ASSET_NAME }} --help

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          # Unlike the release asset (env.ASSET_NAME, deliberately stable),
          # this is just the label for this one workflow run's downloadable
          # build in the Actions UI -- keeping the version here costs
          # nothing and makes browsing past runs easier.
          name: hots-analytics-daemon-v${{ steps.version.outputs.version }}
          path: daemon-python/dist/${{ env.ASSET_NAME }}
          if-no-files-found: error

      # windows-latest (currently the windows-2022 runner image) ships a
      # .NET SDK preinstalled -- confirmed by reading GitHub's own published
      # software manifest for that image
      # (actions/runner-images images/windows/Windows2022-Readme.md), which
      # lists multiple .NET Core SDK versions including several 8.0.x/9.0.x/
      # 10.0.x builds. High confidence: no `actions/setup-dotnet@v4` step is
      # needed before `dotnet tool install`. If a future runner-image bump
      # ever drops the preinstalled SDK, add that step back here.
      - name: Install vpk
        if: needs.bump_version.outputs.tag != '' || startsWith(github.ref, 'refs/tags/v')
        # TODO: pin exact vpk version -- see commit message. Run
        # `dotnet tool install -g vpk` locally (no --version) once, note the
        # version it installs, and pin that exact value here with
        # `--version <PIN_EXACT_VERSION>`, matching this repo's existing
        # "pin exact versions" convention (see this file's Nuitka --mingw64
        # rationale above).
        run: dotnet tool install -g vpk

      # `vpk pack` packages the *entire* contents of --packDir, recursively.
      # Nuitka's `--output-dir=dist` leaves its build intermediates
      # (`dist/run.build/` with the generated C sources and objects,
      # `dist/run.dist/` -- a complete second copy of the standalone app --
      # and `dist/run.onefile-build/`) right next to the finished .exe, so
      # packing `dist` directly would bundle hundreds of MB of build junk
      # into every full *and* delta package. Stage the one file that actually
      # ships instead. (The artifact-upload step above names the single file
      # explicitly for the same reason.)
      - name: Stage the packaged app
        if: needs.bump_version.outputs.tag != '' || startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: mkdir -p pack && cp "dist/${{ env.ASSET_NAME }}" pack/

      - name: Pack release with vpk
        if: needs.bump_version.outputs.tag != '' || startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: >
          vpk pack
          --packId hots-analytics-daemon
          --packVersion ${{ steps.version.outputs.version }}
          --packDir pack
          --mainExe ${{ env.ASSET_NAME }}
          --packTitle "HotS Analytics Daemon"
          --icon assets/app-icon.ico
        # --packId/--mainExe must exactly match `_PACK_ID`/`_EXE_NAME` in
        # daemon-python/src/updater.py's `installed_exe_path` (Task 3) --
        # keep all three in sync if either ever changes.

      - name: Publish to GitHub Releases with vpk
        if: needs.bump_version.outputs.tag != '' || startsWith(github.ref, 'refs/tags/v')
        run: >
          vpk upload github
          --repoUrl https://github.com/aifedespaix/hots-stats
          --token ${{ secrets.GITHUB_TOKEN }}
          --publish
          --tag ${{ needs.bump_version.outputs.tag || github.ref_name }}

  pack-check:
    name: Pack dry run (pull requests)
    # Pack-only guard for pull requests touching the daemon: the same build +
    # stage + `vpk pack` steps `build-windows` runs, with no `vpk upload` and
    # no release, so a packaging regression (a wrong --packId/--mainExe, a
    # --packDir that has picked up Nuitka's build intermediates, a missing
    # icon) fails review instead of producing a broken release. Called for by
    # the design spec's Testing section
    # (docs/superpowers/specs/2026-08-31-daemon-velopack-auto-update-design.md).
    #
    # It repeats `build-windows`'s Nuitka step rather than reusing an
    # artifact because `build-windows` deliberately doesn't run on pull
    # requests -- there is no artifact to reuse. The Nuitka cache below is
    # shared with it, so a PR build is mostly cache hits. See that job for
    # the rationale behind each Nuitka flag; do not let the two drift.
    if: github.event_name == 'pull_request'
    runs-on: windows-latest
    defaults:
      run:
        working-directory: daemon-python

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: daemon-python/pyproject.toml

      - name: Install daemon + build dependencies
        run: pip install -e ".[build]"

      - name: Cache Nuitka compilation cache
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\Nuitka\Nuitka\Cache
          key: nuitka-${{ runner.os }}-${{ hashFiles('daemon-python/pyproject.toml') }}-${{ github.sha }}
          restore-keys: |
            nuitka-${{ runner.os }}-${{ hashFiles('daemon-python/pyproject.toml') }}-
            nuitka-${{ runner.os }}-

      - name: Build with Nuitka
        shell: bash
        run: >
          python -m nuitka
          --onefile
          --standalone
          --mingw64
          --assume-yes-for-downloads
          --enable-plugin=tk-inter
          --windows-console-mode=attach
          --windows-icon-from-ico=assets/app-icon.ico
          --include-package=heroprotocol
          --include-package=watchdog
          --include-package=pystray
          --include-package=PIL
          --include-package=src
          --include-package-data=rapidocr_onnxruntime
          --include-data-files=src/models/en_PP-OCRv5_rec_mobile.onnx=src/models/en_PP-OCRv5_rec_mobile.onnx
          --output-dir=dist
          --output-filename=${{ env.ASSET_NAME }}
          run.py

      - name: Install vpk
        # Same unpinned-version TODO as `build-windows`'s copy of this step;
        # pin both together.
        run: dotnet tool install -g vpk

      - name: Stage the packaged app
        shell: bash
        run: mkdir -p pack && cp "dist/${{ env.ASSET_NAME }}" pack/

      # Deliberately no `vpk upload` counterpart: this job proves the package
      # can be built, and must never publish anything from a pull request.
      # The version is a fixed placeholder since a PR has no release version.
      - name: Pack with vpk (no publish)
        shell: bash
        run: >
          vpk pack
          --packId hots-analytics-daemon
          --packVersion 0.0.1
          --packDir pack
          --mainExe ${{ env.ASSET_NAME }}
          --packTitle "HotS Analytics Daemon"
          --icon assets/app-icon.ico
