[project]
name = "hots-analytics-daemon"
version = "1.0.8"
description = "Windows client that watches for new HotS replays and uploads parsed stats to the HotS Analytics API."
requires-python = ">=3.11"
dependencies = [
    # PyPI's `heroprotocol` hasn't been published since 2.55.4.91756 (Jan 2024)
    # even though Blizzard keeps releasing new builds on GitHub, so pin
    # directly to their latest tag instead. Bump the tag (and rerun
    # `assets/generate_protocol_manifest.py`) whenever a newer one ships.
    "heroprotocol @ git+https://github.com/Blizzard/heroprotocol.git@v2.55.15.96477",
    "watchdog>=4.0",
    "requests>=2.31",
    "mpyq>=0.2.5",
    "pystray>=0.19.5",
    "pillow>=10.0",
    # Live-draft capture feature (src/hotkey.py, screen_capture.py, ocr.py):
    # global hotkey hook, window screenshot, and OCR respectively. `pywin32`
    # only installs on Windows (this whole daemon targets Windows, but the
    # marker keeps `pip install -e ".[dev]"` working for headless CI/dev on
    # other platforms, same reasoning as `winreg` in autostart.py).
    "keyboard>=0.13.5",
    "mss>=9.0.1",
    "pywin32>=306; sys_platform == 'win32'",
    "rapidocr-onnxruntime>=1.3.24",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]
build = [
    "nuitka>=2.4",
]

[tool.pytest.ini_options]
pythonpath = ["."]
